name: Pages

# The site is rebuilt on every push here, and when the Nexolume repository asks for it
# (repository_dispatch "nexolume-updated") or by hand, so the web app under /app/ stays current.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [nexolume-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The browser version of Nexolume (Avalonia + .NET WebAssembly + Rust engine), built from its own repository.
  web-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Lololegeek/nexolume
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          # Same SDK as the one the web build is verified with locally.
          dotnet-version: '10.0.404'
      # The runner image ships .NET 11 workload manifests that clash with the 10.0 ones, so clear them first.
      # Then pin the WebAssembly workload to the 10.0.404 set (manifests 10.0.115, as built locally): the
      # 11.0.0 packs (Emscripten 6) cannot load the SkiaSharp that Avalonia.Browser needs (libSkiaSharp not found).
      - shell: pwsh
        run: |
          # The stale .NET 11 Emscripten manifest is what makes the 10.0 install roll back; this runner is throwaway.
          $stale = Join-Path $env:ProgramFiles 'dotnet\sdk-manifests\11.0.100\microsoft.net.workload.emscripten.net10'
          if (Test-Path $stale) { Remove-Item $stale -Recurse -Force }
          dotnet workload clean --all
          dotnet workload install wasm-tools --version 10.0.404
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: ./scripts/build-web.ps1 -Configuration Release
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: artifacts/web
          retention-days: 1

  build:
    needs: web-app
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /nexolume-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: out/app
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
