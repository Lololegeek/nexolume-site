name: Pages

# The site is rebuilt on every push here, and when the Nexolume repository asks for it
# (repository_dispatch "nexolume-updated") or by hand, so the web app under /app/ stays current.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [nexolume-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The browser version of Nexolume (Avalonia + .NET WebAssembly + Rust engine), built from its own repository.
  web-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Lololegeek/nexolume
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Manifests mode keeps the WebAssembly workload on the 10.0 SDK band (as built locally);
      # the default workload-set mode pulled 11.0 packs whose runtime cannot load libSkiaSharp.
      - run: |
          dotnet workload config --update-mode manifests
          dotnet workload install wasm-tools
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: ./scripts/build-web.ps1 -Configuration Release
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: artifacts/web
          retention-days: 1

  build:
    needs: web-app
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /nexolume-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: out/app
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
